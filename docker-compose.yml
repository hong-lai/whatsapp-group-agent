# Scan the first-login QR from: docker compose logs -f ingest
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: .
    command: ["npx", "tsx", "services/ingest/src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://whatsapp:whatsapp@postgres:5432/whatsapp
      REDIS_URL: redis://redis:6379
      AUTH_DIR: /app/auth_info_baileys
      DOWNLOAD_DIR: /app/downloads
      GROUP_PATTERN: "${GROUP_PATTERN:-Hello|World}"
      HISTORY_REQUEST_MIN_MS: ${HISTORY_REQUEST_MIN_MS:-4000}
      HISTORY_REQUEST_MAX_MS: ${HISTORY_REQUEST_MAX_MS:-12000}
      HISTORY_SETTLE_MIN_MS: ${HISTORY_SETTLE_MIN_MS:-6000}
      HISTORY_SETTLE_MAX_MS: ${HISTORY_SETTLE_MAX_MS:-15000}
      MEDIA_DELAY_MIN_MS: ${MEDIA_DELAY_MIN_MS:-1500}
      MEDIA_DELAY_MAX_MS: ${MEDIA_DELAY_MAX_MS:-4000}
      MEDIA_RETRY_MAX_ATTEMPTS: ${MEDIA_RETRY_MAX_ATTEMPTS:-5}
      MEDIA_RETRY_MIN_MS: ${MEDIA_RETRY_MIN_MS:-5000}
      MEDIA_RETRY_MAX_MS: ${MEDIA_RETRY_MAX_MS:-60000}
      SKIP_MEDIA_DOWNLOAD: ${SKIP_MEDIA_DOWNLOAD:-false}
      CATCHUP_WINDOW_SECONDS: ${CATCHUP_WINDOW_SECONDS:-900}
      CATCHUP_BACKFILL_SECONDS: ${CATCHUP_BACKFILL_SECONDS:-172800}
      CATCHUP_PAGE_SIZE: ${CATCHUP_PAGE_SIZE:-50}
      CATCHUP_MAX_PAGES: ${CATCHUP_MAX_PAGES:-3}
      CATCHUP_BACKFILL_MAX_PAGES: ${CATCHUP_BACKFILL_MAX_PAGES:-40}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-true}
      WORKFLOWS_PROCESS_HISTORY: ${WORKFLOWS_PROCESS_HISTORY:-false}
      ENABLED_WORKFLOWS: ${ENABLED_WORKFLOWS:-daily_site_report}
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./downloads:/app/downloads
    stdin_open: true
    tty: true
    restart: unless-stopped

  api:
    build: .
    command: ["npx", "tsx", "services/api/src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://whatsapp:whatsapp@postgres:5432/whatsapp
      REDIS_URL: redis://redis:6379
      WEB_PORT: 3000
      DASHBOARD_PAGE_SIZE: ${DASHBOARD_PAGE_SIZE:-50}
      DASHBOARD_MAX_PAGE_SIZE: ${DASHBOARD_MAX_PAGE_SIZE:-100}
      ALBUM_PAGE_SIZE: ${ALBUM_PAGE_SIZE:-60}
      ALBUM_MAX_PAGE_SIZE: ${ALBUM_MAX_PAGE_SIZE:-120}
      ALBUM_MAX_BATCH_SIZE: ${ALBUM_MAX_BATCH_SIZE:-500}
      DOWNLOAD_DIR: /app/downloads
      GROUP_PATTERN: "${GROUP_PATTERN:-Hello|World}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-true}
      WORKFLOWS_PROCESS_HISTORY: ${WORKFLOWS_PROCESS_HISTORY:-false}
      ENABLED_WORKFLOWS: ${ENABLED_WORKFLOWS:-daily_site_report}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-1234}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-e2b}
      DAILY_SITE_REPORT_PROMPTS_DIR: /app/private/daily_site_report
      REPORTS_DIR: /app/reports
    volumes:
      - ./downloads:/app/downloads:ro
      - ./reports:/app/reports
      - ./services/workflows/private:/app/private:ro
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Python BullMQ worker. LM Studio must run on the host (not in Docker).
  # Prompts are bind-mounted from ./services/workflows/private (gitignored).
  workflows:
    build: ./services/workflows
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://whatsapp:whatsapp@postgres:5432/whatsapp
      REDIS_URL: redis://redis:6379
      MESSAGE_EVENTS_QUEUE: message-events
      ENABLED_WORKFLOWS: ${ENABLED_WORKFLOWS:-daily_site_report}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-1234}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-e2b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-true}
      LLM_RETRY_MIN_MS: ${LLM_RETRY_MIN_MS:-5000}
      LLM_RETRY_MAX_MS: ${LLM_RETRY_MAX_MS:-60000}
      DAILY_SITE_REPORT_PROMPTS_DIR: /app/private/daily_site_report
      CONCURRENCY: ${WORKFLOWS_CONCURRENCY:-1}
    volumes:
      - ./services/workflows/private:/app/private:ro
      - ./downloads:/app/downloads:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Stable public URL. Needs a domain in Cloudflare + CLOUDFLARE_TUNNEL_TOKEN.
  # Origin in the dashboard must be http://api:3000
  # docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api

  # No domain required. URL is https://….trycloudflare.com and changes on restart.
  # docker compose --profile quick-tunnel up -d
  # docker compose logs -f quick-tunnel
  quick-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:3000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

